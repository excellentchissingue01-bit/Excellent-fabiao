.card{
    background: #ffffff;
    padding: 25px;

}
.card h3{
    margin-bottom: 10px;

}

footer{
    text-align: center;
    padding: 25px;
    background: #222;
    color: white;
}
@media(max-width:700px){
    nav{

    }

        gap: 15px;

        justify-content: center;
