<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    
<style>
        *{
    margin: auto;
    padding-block-end:0;
    box-sizing: border-box;
}
html{
    scroll-behavior: smooth;
}
body{
    font-family: arial,sans-serif;
    line-height: 1,6;
    color: #222;
    background:#f8f9fa;
}
header{
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index:100 ;
}
nav{
    max-width: 1000px;
    margin: auto;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
nav h2{
    color: #2563eb;
}
nav ul{
    list-style: none;
    display: flex;
    gap: 25px;
}
nav a{
    text-decoration: none;
    color: #222;
    font-weight: 500;
}
nav a:hover{
    color: #2563eb;


}
.hero{
    min-height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
}
.small-text{
    color: #2563eb;
    font: 18px;
}
.hero h1{
    font-size: 28px;
    margin: 10px 0;
}
.hero h2{
    font-size: 28px;
    font-weight: normal;
    color: #555;
}
.hero p{
    margin: 15px 0 25px;
}
button{
    background: #2563eb;
    display: inline-block;
    border-radius: 6px;
    color: white;
    text-decoration: none;
    padding: 12px 25px;
}
.button a{
    text-decoration: none;
    color: #ffffff;
}

section{
    max-width: 1000px;
    margin:auto;
    padding:80px 20px;
}
section h2{
    font-size: 32px;
    margin-bottom: 20px;
}
.project{
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 20px;
}
.card{
    background: #ffffff;
    padding: 25px;
    border-radius: 8px;
    border: 1px solid #ddd;
}
.card h3{
    margin-bottom: 10px;
    color: #2563eb;
}

footer{
    text-align: center;
    padding: 25px;
    background: #222;
    color: white;
}
@media(max-width:700px){
    nav{
        flex-direction: column;
        gap: 15px;
    }
    nav ul{
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .hero h1{
        font-size: 48px;
    }
    .project{
        grid-template-columns: 1fr;
    }}
    
    </style>
</head>
<button><a href="INDEX.HTML">home</a></button>

    <h2>contact</h2>
    <p>email: excellentchissingue01@gmail.com</p>

    <h2>contact</h2>
    <p>0604904499</p>
</section>
    
</body>
</html>
